name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master
  workflow_dispatch: # Lets you run it manually from Actions tab

# Grant permissions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel duplicate or older queued runs automatically
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Change to 'dist' or 'build' if using React, Vite, etc.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
