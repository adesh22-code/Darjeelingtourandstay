<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Darjeeling hotels, lodges and homestay directory.">
<title>Darjeeling Homestay & Hotel Directory</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;
  --primary:#7c3aed;--primary2:#5b21b6;--border:#e5e9f0;
  --shadow:0 12px 35px rgba(20,25,45,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.hero{
  background:linear-gradient(135deg,#24104f,#7c3aed 55%,#c084fc);
  color:#fff;padding:54px 20px 42px;
}
.hero-inner{max-width:1200px;margin:auto}
.badge{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:7px 12px;border-radius:999px;font-size:13px;margin-bottom:14px}
h1{font-size:clamp(30px,5vw,52px);margin:0 0 12px;line-height:1.05}
.hero p{margin:0;max-width:720px;color:#eee;font-size:16px}
.wrap{max-width:1200px;margin:-24px auto 50px;padding:0 16px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px}
input,select,button{
  width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
  font:inherit;background:#fff;color:var(--text);outline:none
}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
button{cursor:pointer;background:#f3f0ff;color:var(--primary2);font-weight:700}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 0}
.stat{background:#faf9ff;border:1px solid #ebe6ff;border-radius:12px;padding:10px 14px}
.stat strong{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(20,25,45,.05);display:flex;flex-direction:column;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.num{font-size:12px;color:var(--muted);background:#f3f4f7;padding:5px 8px;border-radius:8px;white-space:nowrap}
.card h2{font-size:18px;margin:0 0 8px;line-height:1.3}
.ps{font-size:13px;color:var(--primary2);font-weight:700;margin-bottom:12px}
.info{display:grid;gap:9px;margin-top:auto}
.row{display:flex;gap:9px;font-size:13px;line-height:1.45}
.icon{width:22px;flex:0 0 22px;text-align:center}
.row a{color:#4c1d95;text-decoration:none;overflow-wrap:anywhere}
.row a:hover{text-decoration:underline}
.empty{padding:45px;text-align:center;color:var(--muted);display:none}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.hero{padding:38px 16px}.wrap{margin-top:-15px}.panel{padding:13px}.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<section class="hero">
  <div class="hero-inner">
    <span class="badge">DARJEELING</span>
    <h1>Homestay & Hotel Directory</h1>
    <p>Search and explore hotels, lodges and homestays across Darjeeling.</p>
  </div>
</section>

<main class="wrap">
  <section class="panel">
    <div class="controls">
      <input id="search" type="search" placeholder="Search by name, address, contact or email…">
      <select id="ps"><option value="">All Locations</option></select>
      <select id="type">
        <option value="">All accommodations</option>
        <option value="homestay">Homestays</option>
        <option value="hotel">Hotels / Lodges</option>
      </select>
      <button id="reset">Reset</button>
    </div>
    <div class="stats">
      <div class="stat"><strong id="total">0</strong><span>Total records</span></div>
      <div class="stat"><strong id="shown">0</strong><span>Showing</span></div>
      <div class="stat"><strong id="stations">0</strong><span>Locations</span></div>
    </div>
  </section>

  <section id="grid" class="grid"></section>
  <div id="empty" class="panel empty">No accommodation found. Try a different search or filter.</div>
</main>

<div class="footer">Always verify contact details before booking.</div>

const $ = id => document.getElementById(id);
const grid = $("grid");
const search = $("search");
const locationFilter = $("ps");
const type = $("type");

function classify(item){
  const s = (item.name || "").toLowerCase();
  return /(homestay|home stay|home-stay|home stay's|home stay's)/.test(s) ? "homestay" : "hotel";
}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function telLink(v){
  const m = String(v||"").match(/\d[\d\s()+-]{5,}/);
  return m ? "tel:" + m[0].replace(/[^\d+]/g,"") : null;
}
function render(list){
  grid.innerHTML = list.map(x => {
    const tel = telLink(x.contact);
    const email = x.email && x.email.toLowerCase() !== "nil" ? x.email : "";
    const website = x.website && x.website.toLowerCase() !== "nil" ? x.website : "";
    return `
      <article class="card">
        <div class="card-top">
          <div>
            <h2>${esc(x.name)}</h2>
            <div class="ps">${esc((x.ps || "Location not listed").replace(/\s*P\.?S\.?$/i, ""))}</div>
          </div>
          <span class="num">#${x.id}</span>
        </div>
        <div class="info">
          <div class="row"><span class="icon">📍</span><span>${esc(x.address || "Address not listed")}</span></div>
          <div class="row"><span class="icon">📞</span><span>${
            tel ? `<a href="${tel}">${esc(x.contact || "Not listed")}</a>` : esc(x.contact || "Not listed")
          }</span></div>
          ${email ? `<div class="row"><span class="icon">✉️</span><a href="mailto:${esc(email)}">${esc(email)}</a></div>` : ""}
          ${website ? `<div class="row"><span class="icon">🌐</span><span>${esc(website)}</span></div>` : ""}
        </div>
      </article>`;
  }).join("");
  $("shown").textContent = list.length.toLocaleString();
  $("empty").style.display = list.length ? "none" : "block";
  grid.style.display = list.length ? "grid" : "none";
}

  const list = DATA.filter(x => {
    const hay = [x.name,x.ps,x.email,x.website,x.address,x.contact].join(" ").toLowerCase();
    return (!q || hay.includes(q))
      && (!station || x.ps === station)
      && (!wantedType || classify(x) === wantedType);
  });
  render(list);
}
const stations = [...new Set(DATA.map(x => x.ps).filter(Boolean))].sort();
stations.forEach(s => {
  const o = document.createElement("option");
  o.value = s; o.textContent = s.replace(/\s*P\.?S\.?$/i, "");
  locationFilter.appendChild(o);
});
$("total").textContent = DATA.length.toLocaleString();
$("stations").textContent = stations.length.toLocaleString();
search.addEventListener("input", apply);
locationFilter.addEventListener("change", apply);
type.addEventListener("change", apply);
$("reset").addEventListener("click", () => {
  search.value = ""; locationFilter.value = ""; type.value = ""; apply();
});
render(DATA);
</script>
</body>
</html>
