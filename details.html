<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homestay Details</title>
    <meta name="description" content="Darjeeling Homestay Directory">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="details.css">
</head>

<body style="font-family: 'Poppins', sans-serif;">

<!-- ===========================
        NAVBAR
=========================== -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-success" href="index.html">
            🌿 Darjeeling Homestay
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar"
                aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="wishlist.html">❤️ Wishlist</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===========================
        HERO IMAGE
=========================== -->
<section class="hero-section">
    <div class="w-100">
        <img id="heroImage"
             src="https://via.placeholder.com/1600x600?text=Homestay+Image"
             class="hero-image w-100"
             alt="Homestay Image"
             loading="lazy">
    </div>
</section>

<!-- ===========================
        SUMMARY CARD
=========================== -->
<section class="summary-section py-4">
    <div class="container">
        <div class="card summary-card border-0 shadow">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-lg-8">
                        <h2 id="detailName" class="fw-bold mb-1"></h2>
                        <p id="detailLocation" class="text-muted mb-2"></p>
                        <h3 id="detailPrice" class="text-success fw-semibold"></h3>
                    </div>
                    <div class="col-lg-4 text-lg-end mt-3 mt-lg-0">
                        <button type="button" id="wishlistBtn" class="btn btn-outline-danger me-2">
                            ❤️ Wishlist
                        </button>
                        <button type="button" id="shareBtn" class="btn btn-success">
                            <i class="fa-solid fa-share"></i> Share
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- ===========================
        DESCRIPTION
=========================== -->
<section class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow rounded-4 mb-4">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-4">About This Homestay</h3>
                        <p id="detailDescription" class="lead mb-0"></p>
                    </div>
                </div>

                <div class="card border-0 shadow rounded-4">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-4">Scenic Highlights</h3>
                        <p id="detailScenery" class="lead mb-0"></p>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-lg-4">
                <!-- Amenities -->
                <div class="card border-0 shadow rounded-4 mb-4">
                    <div class="card-body">
                        <h4 class="fw-bold mb-4">Amenities</h4>
                        <div id="detailAmenities" class="amenities-list"></div>
                    </div>
                </div>

                <!-- Contact -->
                <div class="card border-0 shadow rounded-4">
                    <div class="card-body">
                        <h4 class="fw-bold mb-4">Contact Owner</h4>
                        <div class="d-grid gap-3">
                            <button type="button" id="callBtn" class="btn btn-success">
                                <i class="fa-solid fa-phone"></i> Call Now
                            </button>
                            <button type="button" id="whatsappBtn" class="btn btn-success">
                                <i class="fa-brands fa-whatsapp"></i> WhatsApp
                            </button>
                            <button type="button" id="mapBtn" class="btn btn-outline-success">
                                <i class="fa-solid fa-location-dot"></i> Google Map
                            </button>
                            <button type="button" id="websiteBtn" class="btn btn-outline-success">
                                <i class="fa-solid fa-globe"></i> Website
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- ===========================
        SOCIAL MEDIA
=========================== -->
<section class="pb-5">
    <div class="container">
        <div class="card border-0 shadow rounded-4">
            <div class="card-body text-center">
                <h3 class="fw-bold mb-4">Follow This Homestay</h3>
                <div class="d-flex justify-content-center flex-wrap gap-3">
                    <a id="facebookBtn" href="#" target="_blank" rel="noopener" class="btn btn-primary">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </a>
                    <a id="instagramBtn" href="#" target="_blank" rel="noopener" class="btn btn-danger">
                        <i class="fab fa-instagram"></i> Instagram
                    </a>
                    <a id="youtubeBtn" href="#" target="_blank" rel="noopener" class="btn btn-danger">
                        <i class="fab fa-youtube"></i> YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- ===========================
        PHOTO GALLERY
=========================== -->
<section class="pb-5">
    <div class="container">
        <h2 class="fw-bold mb-4">Photo Gallery</h2>
        <div id="galleryContainer" class="row g-4">
            <!-- Images will come from JavaScript -->
        </div>
    </div>
</section>

<!-- ===========================
        FOOTER
=========================== -->
<footer class="bg-dark text-white py-5 mt-5">
    <div class="container text-center">
        <h4>🌿 Darjeeling Homestay Directory</h4>
        <p class="mt-3">Discover authentic Himalayan hospitality.</p>
        <hr class="border-secondary">
        <p class="mb-0">© 2026 Darjeeling Homestay Directory</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="details.js"></script>
</body>
</html>
